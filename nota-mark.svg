<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Nota</title>
  <!--
    The Nota mark: a lowercase n whose right leg ends in a bookmark notch —
    the place you left off — with a single dot above it: the note, the
    moment something sticks. Terracotta ground, parchment ink.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7784F"/>
      <stop offset="1" stop-color="#C24A28"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#ground)"/>
  <path fill="#FDF6EC" d="M300 770 L300 480 A212 212 0 0 1 724 480 L724 800 L669 752 L614 800 L614 480 A102 102 0 0 0 410 480 L410 770 A55 55 0 0 1 300 770 Z"/>
  <circle cx="800" cy="246" r="54" fill="#FDF6EC"/>
</svg>
